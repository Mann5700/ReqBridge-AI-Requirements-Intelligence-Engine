base_weights:
  EDC: 1.0
  ODC: 1.3
  IDC: 1.6
  MSG: 1.4
  REG: 1.6
  SCAN_STS: 1.5
  BRE_SEC: 1.7
  RPT: 1.1
  INFRA: 1.4
  PERF: 2.0

multipliers:
  change_type:
    config_or_mapping_only: 0.8
    single_rule_or_single_path: 1.0
    multi_rule_or_multi_field: 1.2
    new_ui_flow_queue_or_integration: 1.5
    major_redesign_or_cross_system_orchestration: 1.8
  dependencies:
    none: 1.0
    one_dependency: 1.1
    two_to_three_dependencies: 1.25
    four_plus_or_external_dependencies: 1.5
  test_breadth:
    functional_only: 1.0
    functional_plus_targeted_regression: 1.15
    functional_plus_full_regression: 1.30
    functional_plus_performance: 1.45
    functional_plus_regression_plus_performance: 1.60
  data_env:
    minimal_existing_setup: 1.0
    moderate_setup_or_conditioning: 1.15
    heavy_setup_or_multi_env: 1.35
    perf_prep_purge_image_copy_tooling: 1.60

rom_bands:
  small: [0, 6]
  medium: [6, 12]
  large: [12, 20]
  xlarge: [20, null]

# Signal phrases that indicate a performance-testing cycle is required
# (reference only — generic examples).
perf_triggers:
  architecture_or_platform:
    - "App-server to container/cloud platform migration"
    - "Container routing, orchestration, or cluster changes"
    - "Runtime platform or middleware upgrades"
  instrumentation:
    - "APM / observability instrumentation changes"
  integration_path:
    - "Message-queue, rules-engine, or mainframe interaction changes"
    - "Traffic-flow altering changes across core processing areas (EDC/IDC/ODC)"
  volume_and_throughput:
    - "New transaction types or higher TPS"
    - "Regulatory / compliance initiatives"
    - "Screening / security-scan changes"
    - "Seasonal / peak-load windows"
  diagnostic:
    - "Dropped transactions, queue build-ups, socket timeouts, latency, thread starvation not reproducible functionally"

# Maps a classification category to one or more ROM slices, plus the signal
# phrases used to detect that category in requirement text. These phrases are
# generic placeholders — replace/extend them with your own domain vocabulary.
classification_to_slice:
  DATA_CAPTURE:
    slices: ["EDC", "IDC", "ODC"]
    match_phrases:
      - "data capture"
      - "data validation"
      - "document imaging"
      - "key entry"
      - "corrections"
      - "operational workflow"
      - "ingest"
  RULES:
    slices: ["BRE_SEC"]
    match_phrases:
      - "business rule"
      - "rule engine"
      - "routing"
      - "suspense"
      - "validation rule"
  DELIVERY:
    slices: ["EDC"]
    match_phrases:
      - "delivery date"
      - "plan flow"
      - "forecast"
  SECURITY:
    slices: ["BRE_SEC"]
    match_phrases:
      - "security screening"
      - "denied party"
      - "screening"
  SCAN:
    slices: ["SCAN_STS"]
    match_phrases:
      - "scan"
      - "scanning"
      - "barcode"
      - "scan event"
      - "forecast trigger"
  STATUS:
    slices: ["SCAN_STS"]
    match_phrases:
      - "status"
      - "visibility"
      - "status determination"
      - "status publish"
      - "tracking"
  MESSAGING:
    slices: ["MSG"]
    match_phrases:
      - "messaging"
      - "outbound message"
      - "inbound message"
      - "notification"
      - "distribution"
  REGULATORY:
    slices: ["REG"]
    match_phrases:
      - "regulatory"
      - "filing"
      - "customs"
      - "compliance"
      - "country-specific"
  REPORTING:
    slices: ["RPT"]
    match_phrases:
      - "report"
      - "reporting"
      - "extract"
  INFRA:
    slices: ["INFRA"]
    match_phrases:
      - "infrastructure"
      - "product upgrade"
      - "platform change"
      - "deployment"
      - "environment readiness"
      - "container"
      - "cluster"
  MODERNIZATION:
    slices: ["INFRA", "EDC"]
    match_phrases:
      - "modernization"
      - "interface migration"
  PERFORMANCE:
    slices: ["PERF"]
    match_phrases:
      - "performance"
      - "perf test"
      - "load test"
      - "stress test"
      - "throughput"
      - "latency"
      - "peak"
      - "TPS"
      - "volume"
